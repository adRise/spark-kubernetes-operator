# =============================================================================
# PySpark Wheel Package Test
# =============================================================================
# Tests:
# 1. Using packages pre-installed in image (pandas, numpy)
# 2. Dynamic wheel installation via spark.jars
# 3. spark.submit.pyFiles for .zip modules
#
# Usage:
#   kubectl apply -f pyspark-wheel-test.yaml -n production-spark
#   kubectl logs -f pyspark-wheel-test-0-driver -n production-spark
# =============================================================================

apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: pyspark-wheel-test
  labels:
    app: pyspark-wheel-test
    type: validation
spec:
  # ---------------------------------------------------------------------------
  # Inline Python Script (base64 encoded)
  # ---------------------------------------------------------------------------
  # We'll create a simple Python script that:
  # 1. Tests if packages are importable
  # 2. Uses PySpark to process some data
  # 3. Reports which packages are available
  
  # For this test, we'll use a Python script from S3 that tests packages
  pyFiles: "s3a://tubi-scalamigo-artifacts/adRise/spark/wrapper.py"
  
  # We'll run a test module that checks package availability
  # Since we don't have the test module, let's use inline Python via -c
  # Actually, the operator doesn't support inline Python, so we need a script
  
  driverArgs: []
  
  runtimeVersions:
    sparkVersion: "3.5.3"
    scalaVersion: "2.12"

  applicationTolerations:
    resourceRetainPolicy: Always
    resourceRetainDurationMillis: 3600000
    restartConfig:
      restartPolicy: Never

  driverSpec:
    podTemplateSpec:
      spec:
        serviceAccountName: spark
        containers:
          - name: spark-kubernetes-driver
            # Run a Python command to test packages after Spark starts
            # This won't work as Spark controls the entrypoint, but we can check logs
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi

  sparkConf:
    spark.kubernetes.container.image: "public.ecr.aws/dataminded/spark-k8s-glue:v3.5.3-hadoop-3.3.6-v2"
    spark.kubernetes.container.image.pullPolicy: "IfNotPresent"
    spark.kubernetes.namespace: "production-spark"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    
    # IAM Role
    spark.kubernetes.driver.annotation.iam.amazonaws.com/role: "arn:aws:iam::986748113845:role/flink_scalamigo_access-production"
    
    # S3 access
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.InstanceProfileCredentialsProvider"
    
    # Python configuration
    spark.pyspark.python: "/usr/bin/python3"
    spark.pyspark.driver.python: "/usr/bin/python3"
    
    # ---------------------------------------------------------------------------
    # WHEEL FILE INSTALLATION
    # ---------------------------------------------------------------------------
    # Option 1: Add wheel files via spark.jars (they get added to PYTHONPATH)
    # Example: spark.jars: "s3a://bucket/path/to/package-1.0-py3-none-any.whl"
    
    # Option 2: Use spark.submit.pyFiles for .py, .zip, .egg files
    # spark.submit.pyFiles: "s3a://bucket/path/to/my_module.zip"
    
    # For testing, let's download a small wheel and test it
    # We'll use the 'six' package which is a small, simple compatibility library
    # six-1.16.0-py2.py3-none-any.whl from PyPI
    
    spark.dynamicAllocation.enabled: "false"
    spark.executor.instances: "1"
    spark.kubernetes.driver.deleteOnTermination: "false"

